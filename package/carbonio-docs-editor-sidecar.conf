# Drop-in for carbonio-docs-editor.service, installed only on the distros that
# ship the modern carbonio-docs-editor-sidecar.service (not rocky_8 /
# ubuntu_jammy).
# Starting the service pulls in its sidecar. Wants only: a sidecar skipped for
# a missing token must not block the service. The editor does not need its
# docs-connector upstream to start, so the sidecar is ordered after the service
# (After=carbonio-docs-editor.service in the sidecar) and no After is added here
# (it would create an ordering cycle). The sidecar declares
# PartOf=carbonio-docs-editor.service, so stop and restart propagate to it.
# Ordering is node-local: the sidecar is shipped by this same package.
[Unit]
Wants=carbonio-docs-editor-sidecar.service
